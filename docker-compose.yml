services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pixegotchi-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:?REDIS_PORT is required}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pixegotchi-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    command:
      - sh
      - -c
      - npm run build:dev --workspace=@pixegotchi/shared && (npm run dev --workspace=@pixegotchi/shared & npm run dev:watch --workspace=@pixegotchi/backend)
    ports:
      - "127.0.0.1:${BACKEND_PORT:?BACKEND_PORT is required}:3000"
    env_file:
      - ./packages/backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3000
      NODE_ENV: development
      TON_NETWORK: ${TON_NETWORK:-testnet}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_TO_FILE: ${LOG_TO_FILE:-false}
      LOG_FILE_PATH: ${LOG_FILE_PATH:-/var/log/pixegotchi/backend.log}
      APP_VERSION: ${APP_VERSION:-development}
      CHECKPOINT_DISABLE: "1"
    volumes:
      - ./packages/backend:/app/packages/backend
      - ./packages/shared:/app/packages/shared
      - backend_node_modules:/app/packages/backend/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
      - ./runtime/logs/backend:/var/log/pixegotchi
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pixegotchi-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

  prisma-studio:
    profiles: ["tools"]
    build:
      context: ./packages/backend
      dockerfile: prisma-studio.Dockerfile
    ports:
      - "127.0.0.1:${PRISMA_STUDIO_PORT:?PRISMA_STUDIO_PORT is required}:51212"
    env_file:
      - ./packages/backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pixegotchi-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:
  shared_node_modules:

networks:
  pixegotchi-network:
    driver: bridge
