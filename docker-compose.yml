services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pixegotchi-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:?REDIS_PORT is required}:6379"
    volumes:
      - redis_data:/data
    networks:
      - pixegotchi-network
    restart: unless-stopped

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    # image: fediukv/pixegotchi-backend:latest
    ports:
      - "127.0.0.1:${BACKEND_PORT:?BACKEND_PORT is required}:${BACKEND_PORT:?BACKEND_PORT is required}"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      REDIS_URL: redis://redis:6379
      PORT: ${BACKEND_PORT:?BACKEND_PORT is required}
      TON_NETWORK: ${TON_NETWORK:?TON_NETWORK is required}
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      LOG_LEVEL: ${LOG_LEVEL:?LOG_LEVEL is required}
      LOG_TO_FILE: ${LOG_TO_FILE:?LOG_TO_FILE is required}
      LOG_FILE_PATH: ${LOG_FILE_PATH:?LOG_FILE_PATH is required}
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
    env_file:
      - ./packages/backend/.env
    volumes:
      - ./packages/backend/src:/app/src
      - ./packages/shared:/shared
      - ./packages/backend/prisma:/app/prisma
      - ./packages/backend/.env:/app/.env
      - ./runtime/logs/backend:/var/log/pixegotchi
    depends_on:
      - postgres
      - redis
    networks:
      - pixegotchi-network
    # command: sh -c 'sleep infinity'
    # command: sh -c "npm run dev:docker"
    # command: sh -c "npm install && npm run dev"
    command: sh -c "npm run prisma:generate && npm run prisma:migrate && npm run dev"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

  prisma-studio:
    build:
      context: ./packages/backend
      dockerfile: prisma-studio.Dockerfile
    # image: fediukv/pixegotchi-prisma-studio:latest
    ports:
      - "${PRISMA_STUDIO_PORT:?PRISMA_STUDIO_PORT is required}:51212"
    # expose:
    #   - "51212"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
    volumes:
      - ./packages/backend/prisma:/app/prisma
      - ./packages/backend/.env:/app/.env
    depends_on:
      - postgres
    networks:
      - pixegotchi-network
    command: sh -c "npx prisma generate && BROWSER=none npx prisma studio --port 51212"
    restart: unless-stopped

  # nginx:
  #   build:
  #     context: ./nginx
  #     dockerfile: Dockerfile
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./packages/nginx/conf.d:/etc/nginx/conf.d
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #     - ./packages/nginx/.htpasswd:/etc/nginx/.htpasswd
  #   depends_on:
  #     - backend
  #     - prisma-studio
  #   networks:
  #     - pixegotchi-network
  #   restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  pixegotchi-network:
    driver: bridge
