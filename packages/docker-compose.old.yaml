version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pixegotchi
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpixe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./packages/backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://admin:adminpixe@postgres:5432/pixegotchi
      REDIS_URL: redis://redis:6379
      TON_NETWORK: testnet
    depends_on:
      - postgres
      - redis
    volumes:
      - ./packages/backend/src:/app/src

volumes:
  postgres_data:
  redis_data:
