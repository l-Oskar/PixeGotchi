server {
    listen 80;
    server_name pixegotchi.run.place studio.pixegotchi.run.place;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pixegotchi.run.place;

    ssl_certificate /etc/letsencrypt/live/pixegotchi.run.place/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixegotchi.run.place/privkey.pem;

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl;
    server_name studio.pixegotchi.run.place;

    ssl_certificate /etc/letsencrypt/live/pixegotchi.run.place/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixegotchi.run.place/privkey.pem;

    location / {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://prisma-studio:51212/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
