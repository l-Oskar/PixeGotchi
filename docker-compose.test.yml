services:
  postgres-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pixegotchi_test
      POSTGRES_USER: pixegotchi_test
      POSTGRES_PASSWORD: pixegotchi_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixegotchi_test -d pixegotchi_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pixegotchi-test-network
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  redis-test:
    profiles: ["test"]
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pixegotchi-test-network

  backend-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    environment:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://pixegotchi_test:pixegotchi_test@postgres-test:5432/pixegotchi_test?schema=public
      REDIS_URL: redis://redis-test:6379
      JWT_SECRET: test-jwt-secret-must-be-at-least-32-chars
      JWT_EXPIRES_IN: 1h
      TELEGRAM_BOT_TOKEN: test-telegram-bot-token
      TON_NETWORK: testnet
      LOG_LEVEL: silent
      LOG_TO_FILE: "false"
      APP_VERSION: test
      CHECKPOINT_DISABLE: "1"
    command:
      - sh
      - -c
      - npm run build:dev --workspace=@pixegotchi/shared && npm run test --workspace=@pixegotchi/backend
    volumes:
      - ./packages/backend:/app/packages/backend
      - ./packages/shared:/app/packages/shared
      - test_backend_node_modules:/app/packages/backend/node_modules
      - test_shared_node_modules:/app/packages/shared/node_modules
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - pixegotchi-test-network

volumes:
  postgres_test_data:
  test_backend_node_modules:
  test_shared_node_modules:

networks:
  pixegotchi-test-network:
    driver: bridge
